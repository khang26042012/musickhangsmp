name: Build MusicKhangSMP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Build with Maven
        run: mvn -B package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MusicKhangSMP-jar
          path: target/MusicKhangSMP-*.jar
      - name: Create release on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MusicKhangSMP v1.0.0
          files: target/MusicKhangSMP-*.jar
